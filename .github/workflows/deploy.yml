
name: CI/CD

on:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            KSP/backend/package-lock.json
            KSP/frontend/package-lock.json

      - name: Backend install and test
        working-directory: KSP/backend
        run: |
          npm ci
          npm test --if-present

      - name: Frontend build
        working-directory: KSP/frontend
        run: |
          npm ci
          npm run build
        env:
          CI: false
          REACT_APP_API_URL: /api

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: KSP/frontend/build