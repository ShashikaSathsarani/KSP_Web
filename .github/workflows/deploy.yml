name: CI/CD

on:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          LFS: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            KSP/backend/package-lock.json
            KSP/frontend/package-lock.json

      - name: Backend install and test
        working-directory: KSP/backend
        run: |
          npm ci
          npm test --if-present

      - name: Frontend build
        working-directory: KSP/frontend
        run: |
          npm ci
          npm run build
        env:
          CI: false
          REACT_APP_API_URL: /api

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: KSP/frontend/build

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: build

      - name: Upload frontend to VPS
        uses: Burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete
          path: build/
          remote_path: /var/www/myapp/frontend/
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH }}

      - name: Deploy backend
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH }}
          script: |
            set -e
            cd /var/www/myapp/repo
            git pull origin main
            cd KSP/backend
            npm ci --omit=dev
            pm2 reload myapp-api --update-env